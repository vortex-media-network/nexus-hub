<script>

  const categories = [

  const languages = ["English", "Hindi", "Punjabi", "Urdu", "Bangla", "Tamil", "Telugu", "Marathi", "Gujarati", "Spanish", "Arabic"];

  // 100+ Pre-populated Groups covering all categories (Country: India, Language: English)

  const titlesPerCat = {
    "Adult/18+/Hot": ["Midnight Secret Chat", "Desi Hot Singles Club", "Late Night Gossip", "Adult Fun Zone India"],
    "Art/Design/Photography": ["Indian Photographers Hub", "Graphic & UI/UX Designers", "Digital Canvas & Sketch", "Visual Artists India"],
    "Auto/Vehicle": ["Superbikes & Cars India", "Automobile Modifications", "Bullet & Riders Club", "Car Tuning & Deals"],
    "Business/Advertising/Marketing": ["Digital Marketers India", "Startup Founders Network", "B2B Business Leads", "Affiliate Marketing Pro"],
    "Comedy/Funny": ["Non-Stop Meme Adda", "Desi Standup Comedy Fans", "Daily Funny Video Clips", "Ultimate Joke Station"],
    "Dating/Flirting/Chatting": ["All India Friendship Adda", "Cute Singles Meet", "Online Flirt & Romance", "Soulmates Match Hub"],
    "Education/School": ["Govt Job Prep (SSC/UPSC)", "CBSE & ICSE Students Club", "Free PDF Study Material", "Coding & Python Learning"],
    "Entertainment/Masti": ["Bollywood Buzz & Masti", "Daily Entertainment Lounge", "Web Series Discussions", "Desi Party Adda"],
    "Family/Relationships": ["Happy Family Life Tips", "Relationship & Parenting Advice", "Life Motivation & Bonding", "Heart-to-Heart Sharing"],
    "Fan Club/Celebrities": ["Cricket Stars Fan Club", "Bollywood Heroes & Heroines", "Global Popstars Fans", "South Movie Stars Adda"],
    "Fashion/Style/Clothing": ["Streetwear & Daily Fashion", "Indian Traditional Wear Deals", "Sneakerheads & Style", "Top Trending Outfits"],
    "Film/Animation": ["Cinema & Hollywood Updates", "Anime & Manga India", "Film Direction & Editing", "Box Office Tracking"],
    "Food/Drinks": ["Desi Street Food Lovers", "Home Chefs Recipe Book", "Baking & Cake Specials", "Foodies Corner India"],
    "Gaming/Apps": ["Free Fire Max India", "BGMI Pro Esports Squad", "GTA & PC Gamers Club", "Android Mod Apps Zone"],
    "Health/Beauty/Fitness": ["Gym Motivation & Diet", "Yoga & Daily Wellness", "Skin Care & Beauty Secrets", "Weight Loss Tips Club"],
    "Jobs/Career": ["IT & Remote Work Alerts", "Private Jobs Pan India", "Resume Tips & Career Guidance", "Work From Home Vacancies"],
    "Money/Earning": ["Online Earning Ideas 2026", "Crypto & Forex Traders", "Stock Market Intraday Calls", "Passive Income Builders"],
    "Music/Audio/Songs": ["Punjabi Hits & Beats", "Bollywood Melody Songs", "Indie Music Creators Hub", "EDM & DJ Remix Lovers"],
    "News/Magazines/Politics": ["Daily Breaking News India", "Current Affairs Discussion", "Tech & Global Headline News", "Political Debates Adda"],
    "Pets/Animals/Nature": ["Dog Lovers & Pet Care", "Wild Animals & Nature Shots", "Aquarium & Fish Keepers", "Bird Care India"],
    "Roleplay/Comics": ["Superheroes Roleplay Zone", "Marvel & DC Comic Readers", "Fantasy RP Community", "Manga Roleplay India"],
    "Science/Technology": ["AI Tools & Future Tech", "Tech Geeks & Hacks", "Space & Astronomy Science", "Smartphone Reviews & Leaks"],
    "Shopping/Buy/Sell": ["Amazon/Flipkart Loot Deals", "Wholesale Cloth & Gadgets", "Reselling Community India", "Best Discount Coupons"],
    "Social/Friendship/Community": ["True Friends Forever", "All India Social Gathering", "Chill & Talk Lounge", "Open Minded Community"],
    "Spiritual/Devotional": ["Daily Bhakti & Mantras", "Spiritual Peace & Meditation", "Gurbani & Satsang Vichar", "Positive Life Vibe"],
    "Sports/Games": ["Indian Cricket Fan Army", "Football & Premier League", "Pro Kabaddi League Fans", "Fitness & Athletics Adda"],
    "Thoughts/Quotes/Jokes": ["Daily Inspirational Quotes", "Deep Thoughts & Shayari", "Humour & Laughter Club", "Life Philosophy Adda"],
    "Travel/Local/Place": ["Himachal & Goa Travellers", "Solo Backpackers India", "Road Trips & Camping", "Budget Tour Guide Hub"]
  };

  categories.forEach(cat => {
    const list = titlesPerCat[cat] || [`${cat} Official Group`, `${cat} Community`];
    list.forEach(title => {
      default100Groups.push({
        cat: cat,
        country: "India",
        lang: "English",
        title: title,
        link: "https://chat.whatsapp.com/invite/" + Math.random().toString(36).substring(2, 10)
      });
    });
  });

  function sanitize(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function populateDropdowns() {
    const fCat = document.getElementById('filterCategory');
    const fCount = document.getElementById('filterCountry');
    const fLang = document.getElementById('filterLanguage');
    const inCat = document.getElementById('inCat');
    const inCount = document.getElementById('inCountry');
    const inLang = document.getElementById('inLang');

    fCat.innerHTML = '<option value="All">All Categories</option>' + categories.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    fCount.innerHTML = '<option value="All">All Countries</option>' + countries.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    fLang.innerHTML = '<option value="All">All Languages</option>' + languages.map(l => `<option value="${sanitize(l)}">${sanitize(l)}</option>`).join('');

    inCat.innerHTML = categories.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    inCount.innerHTML = countries.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    inLang.innerHTML = languages.map(l => `<option value="${sanitize(l)}">${sanitize(l)}</option>`).join('');
  }

  let groups = [];

  async function fetchLiveGroups() {
    try {
      const res = await fetch(FIREBASE_DB_URL);
      const data = await res.json();
      if (data) {
        const userSubmitted = Object.values(data).reverse();
        groups = [...userSubmitted, ...default100Groups];
      } else {
        groups = [...default100Groups];
      }
      renderList(groups);
    } catch(err) {
      groups = [...default100Groups];
      renderList(groups);
    }
  }

  function renderList(list) {
    const container = document.getElementById('groupGrid');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 25px; color:#a26081; font-weight:bold;">No WhatsApp groups found for this selection.</p>';
      return;
    }
    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'group-card';
      const displayTitle = sanitize(item.title || `${item.country} • ${item.cat}`);
      card.innerHTML = `
        <div>
          <div class="group-title">${displayTitle}</div>
          <div class="group-tags">
            🌸 <b>Category:</b> ${sanitize(item.cat)}<br>
            🌍 <b>Country:</b> ${sanitize(item.country)}<br>
            🗣️ <b>Language:</b> ${sanitize(item.lang)}
          </div>
        </div>
        <button class="btn-join" onclick="handleJoin('${encodeURI(item.link)}')">Join WhatsApp Group</button>
      `;
      container.appendChild(card);
    });
  }

  function handleJoin(targetLink) {
    window.open(ADSTERRA_DIRECT_LINK, '_blank');
    setTimeout(() => {
      window.location.href = targetLink;
    }, 400);
  }

  function applyFilter() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('filterCategory').value;
    const country = document.getElementById('filterCountry').value;
    const lang = document.getElementById('filterLanguage').value;

    const filtered = groups.filter(g => {
      const textToSearch = `${g.cat} ${g.country} ${g.lang} ${g.title || ''}`.toLowerCase();
      const matchSearch = textToSearch.includes(search);
      const matchCat = (cat === "All" || g.cat === cat);
      const matchCountry = (country === "All" || g.country === country);
      const matchLang = (lang === "All" || g.lang === lang);
      return matchSearch && matchCat && matchCountry && matchLang;
    });

    renderList(filtered);
  }

  function openModal() { document.getElementById('addModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('addModal').style.display = 'none'; }

  let lastSubmissionTime = 0;

  async function submitGroup() {
    const now = Date.now();
    if (now - lastSubmissionTime < 20000) {
      alert("Please wait a few seconds before submitting another link.");
      return;
    }

    const link = document.getElementById('inLink').value.trim();
    const cat = document.getElementById('inCat').value;
    const country = document.getElementById('inCountry').value;
    const lang = document.getElementById('inLang').value;

    const isWhatsAppUrl = /^(https?:\/\/)?chat\.whatsapp\.com\/[a-zA-Z0-9_\-]+/i.test(link);
    if(!isWhatsAppUrl) {
      alert("Invalid link! Only official WhatsApp group invite links (chat.whatsapp.com/...) are accepted.");
      return;
    }

    const newGroup = { cat, country, lang, link, title: `${country} • ${cat} Official`, timestamp: now };
    
    try {
      document.getElementById('btnSubmit').innerText = "Adding...";
      await fetch(FIREBASE_DB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newGroup)
      });
      lastSubmissionTime = now;
      document.getElementById('btnSubmit').innerText = "Add Group";
      groups.unshift(newGroup);
      renderList(groups);
      document.getElementById('inLink').value = '';
      closeModal();
      alert("WhatsApp group added live on Pink Adda!");
    } catch(e) {
      alert("Error submitting. Please check your internet connection.");
    }
  }

  populateDropdowns();
  fetchLiveGroups();
</script>
