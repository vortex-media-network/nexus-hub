  function sanitize(str) {
    return String(str || '').replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function initDropdowns() {
    var fCat = document.getElementById('filterCategory');
    var fCount = document.getElementById('filterCountry');
    var fLang = document.getElementById('filterLanguage');
    var inCat = document.getElementById('inCat');
    var inCount = document.getElementById('inCountry');
    var inLang = document.getElementById('inLang');

    if(fCat) fCat.innerHTML = '<option value="All">All Categories</option>' + categories.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
    if(fCount) fCount.innerHTML = '<option value="All">All Countries</option>' + countries.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
    if(fLang) fLang.innerHTML = '<option value="All">All Languages</option>' + languages.map(function(l){ return '<option value="'+l+'">'+l+'</option>'; }).join('');

    if(inCat) inCat.innerHTML = categories.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
    if(inCount) inCount.innerHTML = countries.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
    if(inLang) inLang.innerHTML = languages.map(function(l){ return '<option value="' + l + '">' + l + '</option>'; }).join('');
  }

  function renderList(list) {
    var container = document.getElementById('groupGrid');
    if (!container) return;
    container.innerHTML = '';

    if (list.length === 0) {
      container.innerHTML = '<div style="background:white; padding:25px; text-align:center; border-radius:10px; color:#64748b;">No WhatsApp groups found.</div>';
      return;
    }

    list.forEach(function(g) {
      var card = document.createElement('div');
      card.className = 'group-card';
      var mainCat = (g.cat || 'General').split('/')[0];
      var img = g.image || DEFAULT_WA_IMG;

      card.innerHTML = 
        '<div class="card-top">' +
          '<img src="' + img + '" class="group-avatar-img" onerror="this.src=\'' + DEFAULT_WA_IMG + '\'">' +
          '<div>' +
            '<div class="card-title">' + sanitize(g.title || 'WhatsApp Group') + '</div>' +
            '<div class="card-meta-line"><span>📚 ' + sanitize(g.cat || 'General') + '</span> • <span>🌍 ' + sanitize(g.country || 'India') + '</span> • <span>🗣️ ' + sanitize(g.lang || 'English') + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="card-desc">' + sanitize(g.desc || 'Join this active WhatsApp group for daily updates.') + '</div>' +
        '<span class="tag-pill">' + sanitize(mainCat) + '</span>' +
        '<div class="card-bottom-actions">' +
          '<a class="btn-join-text" onclick="handleJoin(\'' + encodeURI(g.link || '') + '\')">Join group</a>' +
          '<button class="share-btn-wa" onclick="shareGroup(\'' + encodeURIComponent(g.title || 'WhatsApp Group') + '\')">Share</button>' +
        '</div>';
      container.appendChild(card);
    });
  }

  function handleJoin(link) {
    try { window.open(ADSTERRA_DIRECT_LINK, '_blank'); } catch(e){}
    setTimeout(function() {
      window.location.href = link || 'https://chat.whatsapp.com/';
    }, 400);
  }

  function shareGroup(title) {
    window.open('https://api.whatsapp.com/send?text=Join%20' + title + '%20on%20PinkAdda:%20' + encodeURIComponent(window.location.href));
  }

  function filterGroups() {
    var q = (document.getElementById('searchInput').value || '').toLowerCase();
    var cat = document.getElementById('filterCategory').value;
    var country = document.getElementById('filterCountry').value;
    var lang = document.getElementById('filterLanguage').value;

    var filtered = groupsData.filter(function(g) {
      var matchQ = (g.title + ' ' + (g.desc || '') + ' ' + (g.cat || '')).toLowerCase().indexOf(q) !== -1;
      var matchCat = (cat === 'All' || g.cat === cat);
      var matchCountry = (country === 'All' || g.country === country);
      var matchLang = (lang === 'All' || g.lang === lang);
      return matchQ && matchCat && matchCountry && matchLang;
    });

    renderList(filtered);
  }

  function openAddModal() {
    document.getElementById('inLink').value = '';
    document.getElementById('inDesc').value = '';
    document.getElementById('addModalOverlay').style.display = 'flex';
  }

  function closeAddModal() {
    document.getElementById('addModalOverlay').style.display = 'none';
  }

  // 5 GROUPS PER DAY PER BROWSER LIMIT LOGIC
  function checkDailyLimit() {
    var today = new Date().toDateString();
    var storedData = JSON.parse(localStorage.getItem('user_group_post_limit') || '{}');
    
    if (storedData.date !== today) {
      storedData = { date: today, count: 0 };
    }
    
    if (storedData.count >= 5) {
      return false; // Limit Reached
    }
    return true;
  }

  function incrementLimitCount() {
    var today = new Date().toDateString();
    var storedData = JSON.parse(localStorage.getItem('user_group_post_limit') || '{}');
    
    if (storedData.date !== today) {
      storedData = { date: today, count: 1 };
    } else {
      storedData.count += 1;
    }
    localStorage.setItem('user_group_post_limit', JSON.stringify(storedData));
  }

  function submitGroup() {
    // Check Limit
    if (!checkDailyLimit()) {
      alert("Daily limit reached! You can only add 5 groups per day. Please clear your browser data or try tomorrow.");
      return;
    }

    var link = document.getElementById('inLink').value.trim();
    var desc = document.getElementById('inDesc').value.trim();
    var cat = document.getElementById('inCat').value;
    var country = document.getElementById('inCountry').value;
    var lang = document.getElementById('inLang').value;

    var isWhatsAppUrl = /^(https?:\/\/)?chat\.whatsapp\.com\/[a-zA-Z0-9_\-]+/i.test(link);
    if (!isWhatsAppUrl) {
      alert('Only official WhatsApp group invite links (chat.whatsapp.com/...) are accepted!');
      return;
    }

    document.getElementById('btnSubmit').innerText = 'Adding...';

    // Auto-fetch Group Info
    fetch('https://api.microlink.io?url=' + encodeURIComponent(link))
      .then(function(res){ return res.json(); })
      .then(function(json){
        var autoTitle = (cat.split('/')[0] + " Group");
        var autoDP = DEFAULT_WA_IMG;

        if (json.status === "success" && json.data) {
          if (json.data.title) {
            autoTitle = json.data.title.replace("WhatsApp Group Invite", "").trim();
          }
          if (json.data.image && json.data.image.url) {
            autoDP = json.data.image.url;
          }
        }
        saveFinalGroup(autoTitle, autoDP);
      })
      .catch(function(){
        saveFinalGroup((cat.split('/')[0] + " Group"), DEFAULT_WA_IMG);
      });

    function saveFinalGroup(title, image) {
      var newGroup = {
        title: title,
        image: image,
        desc: desc || "Active WhatsApp Group. Join now for latest updates.",
        cat: cat,
        country: country,
        lang: lang,
        link: link,
        timestamp: Date.now()
      };

      fetch(FIREBASE_DB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newGroup)
      }).then(function(){
        incrementLimitCount();
        groupsData.unshift(newGroup);
        filterGroups();
        closeAddModal();
        alert('Group added live successfully!');
      }).catch(function(){
        incrementLimitCount();
        groupsData.unshift(newGroup);
        filterGroups();
        closeAddModal();
        alert('Group added live successfully!');
      }).finally(function(){
        document.getElementById('btnSubmit').innerText = 'Submit Group';
      });
    }
  }

  function loadFirebase() {
    fetch(FIREBASE_DB_URL)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data) {
          var liveArr = Object.values(data).reverse();
          groupsData = liveArr.concat(groupsData);
        }
        filterGroups();
      })
      .catch(function(){
        filterGroups();
      });
  }

  // Initial Load
  initDropdowns();
  renderList(groupsData);
  loadFirebase();
</script>
