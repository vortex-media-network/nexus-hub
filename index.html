<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Squads & Creator Network | Official Directory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #090d16; color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; padding: 20px 12px; }
    .wrapper { max-width: 480px; width: 100%; }
    .header { text-align: center; margin-bottom: 18px; }
    .badge { display: inline-block; padding: 4px 12px; background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
    .header h1 { font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .search-bar { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid #1e293b; background: #131b2e; color: #ffffff; font-size: 14px; outline: none; margin-bottom: 16px; }
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; font-size: 12px; color: #64748b; }
    .groups-list { display: flex; flex-direction: column; gap: 10px; }
    .group-card { background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.06); padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; }
    .group-left { display: flex; align-items: center; gap: 12px; }
    .group-icon { font-size: 22px; width: 42px; height: 42px; background: #090d16; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .group-title { font-size: 14px; font-weight: 600; color: #f8fafc; margin-bottom: 2px; }
    .group-meta { font-size: 11px; color: #22c55e; font-weight: 500; }
    .btn-join { background: #25D366; color: #ffffff; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-join:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <span class="badge">● Verified Global Hub</span>
      <h1>Global Communities & Squads</h1>
      <p>Select your favorite squad to join instant chat rooms & exclusive drops.</p>
    </div>
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search squad (GTA, Fortnite, Tech...)" onkeyup="searchSquads()">
    <div class="stats-bar">
      <span id="groupCount">Showing All Squads</span>
      <span>🟢 Instant Access</span>
    </div>
    <div class="groups-list" id="squadContainer"></div>
  </div>

  <script>
    // ਤੁਹਾਡਾ Adsterra ਲਿੰਕ ਇੱਥੇ ਲੱਗਾ ਹੋਇਆ ਹੈ:
    const ADSTERRA_LINK = "https://www.effectivecpmnetwork.com/bwk3i6y31?key=6e1b96d31c0b3e0dcc81cd10c035d3dd";

    const squads = [
      { name: "USA Gamers & Esports Elite", icon: "🇺🇸", members: "1,024 Active" },
      { name: "Fortnite & Warzone US/EU", icon: "🎯", members: "980 Active" },
      { name: "GTA Online VIP Meets", icon: "🏎️", members: "890 Active" },
      { name: "Free Fire & BGMI Pro", icon: "🔥", members: "1,010 Active" },
      { name: "Call of Duty Global Squad", icon: "🪖", members: "750 Active" },
      { name: "Daily Tech & AI Prompt Tools", icon: "⚡", members: "1,030 Active" },
      { name: "PlayStation & Xbox VIP", icon: "🎮", members: "840 Active" },
      { name: "Roblox Codes & Trades", icon: "🧱", members: "910 Active" },
      { name: "Crypto & Alpha Signals", icon: "💎", members: "880 Active" },
      { name: "Steam Keys & Free Game Alerts", icon: "🕹️", members: "990 Active" },
      { name: "UK & European Gamers Hub", icon: "🇬🇧", members: "940 Active" },
      { name: "Canada & Australia Squads", icon: "🇨🇦", members: "780 Active" },
      { name: "Cybersecurity & Ethical Hacks", icon: "🛡️", members: "930 Active" },
      { name: "PUBG Mobile World League", icon: "🥇", members: "950 Active" }
    ];

    const container = document.getElementById("squadContainer");
    const countDisplay = document.getElementById("groupCount");

    function renderSquads(list) {
      container.innerHTML = "";
      countDisplay.textContent = `Showing ${list.length} Squads`;
      list.forEach((s) => {
        const card = document.createElement("div");
        card.className = "group-card";
        card.innerHTML = `
          <div class="group-left">
            <div class="group-icon">${s.icon}</div>
            <div>
              <div class="group-title">${s.name}</div>
              <div class="group-meta">● ${s.members}</div>
            </div>
          </div>
          <button class="btn-join" onclick="openAdsterra()">Join ➔</button>
        `;
        container.appendChild(card);
      });
    }

    // ਕਲਿੱਕ ਕਰਨ 'ਤੇ Adsterra ਲਿੰਕ ਖੁੱਲ੍ਹੇਗਾ
    function openAdsterra() {
      window.location.href = ADSTERRA_LINK;
    }

    function searchSquads() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = squads.filter(s => s.name.toLowerCase().includes(q));
      renderSquads(filtered);
    }

    renderSquads(squads);
  </script>
</body>
</html>
