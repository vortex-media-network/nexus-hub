<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="NCQ9JGMsWUWIDwu9jbDUrViYH8y1s9IpUo3nNlCLTy0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroupSor - Enjoy Unlimited Groups</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f7f9fa; color: #333; }
    header { background: #00a884; color: white; padding: 20px 15px; text-align: center; }
    header h1 { font-size: 26px; font-weight: bold; }
    header p { font-size: 14px; opacity: 0.9; margin-top: 4px; }
    .container { max-width: 900px; margin: auto; padding: 15px; }

    .top-actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .search-box input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
    .btn-add-main { background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
    .btn-add-main:hover { background: #1ebc59; }

    .filter-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    .filter-card select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    .btn-find { background: #00a884; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }

    .group-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .group-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border-top: 4px solid #00a884; display: flex; flex-direction: column; justify-content: space-between; }
    .group-title { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 8px; }
    .group-tags { font-size: 12px; color: #666; margin-bottom: 15px; line-height: 1.6; }
    .btn-join { display: block; width: 100%; text-align: center; background: #00a884; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; }
    .btn-join:hover { background: #075e54; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 15px; z-index: 999; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { color: #00a884; margin-bottom: 15px; }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-cancel { background: #888; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>GroupSor</h1>
  <p>Enjoy Unlimited Groups</p>
</header>

<div class="container">

  <div class="top-actions">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Type Keywords to Search..." onkeyup="applyFilter()">
    </div>
    <button class="btn-add-main" onclick="openModal()">+ Add Whatsapp Group</button>
  </div>

  <div class="filter-card">
    <select id="filterCategory" onchange="applyFilter()"></select>
    <select id="filterCountry" onchange="applyFilter()"></select>
    <select id="filterLanguage" onchange="applyFilter()"></select>
    <button class="btn-find" onclick="applyFilter()">Find group</button>
  </div>

  <div class="group-list" id="groupGrid"></div>

</div>

<!-- ADD GROUP MODAL -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Add WhatsApp / Telegram Group</h3>
    <input type="text" id="inLink" placeholder="Enter Group Invite Link...">
    <input type="text" id="inName" placeholder="Enter Group Name...">
    <select id="inCat"></select>
    <select id="inCountry"></select>
    <select id="inLang"></select>
    <input type="text" id="inTags" placeholder="Enter Tags (Optional, separated by comma)">

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add-main" onclick="submitGroup()">Submit Group</button>
    </div>
  </div>
</div>

<script>
  const ADSTERRA_DIRECT_LINK = "https://www.effectivecpmnetwork.com/bwk3i6y31?key=6e1b96d31c0b3e0dcc81cd10c035d3dd";

  const categories = [
    "Adult/18+/Hot", "Art/Design/Photography", "Auto/Vehicle", "Business/Advertising/Marketing",
    "Comedy/Funny", "Dating/Flirting/Chatting", "Education/School", "Entertainment/Masti",
    "Family/Relationships", "Fan Club/Celebrities", "Fashion/Style/Clothing", "Film/Animation",
    "Food/Drinks", "Gaming/Apps", "Health/Beauty/Fitness", "Jobs/Career", "Money/Earning",
    "Music/Audio/Songs", "News/Magazines/Politics", "Pets/Animals/Nature", "Roleplay/Comics",
    "Science/Technology", "Shopping/Buy/Sell", "Social/Friendship/Community", "Spiritual/Devotional",
    "Sports/Games", "Thoughts/Quotes/Jokes", "Travel/Local/Place"
  ];

  const countries = [
    "Algeria", "Argentina", "Australia", "Austria", "Azerbaijan", "Bahrain", "Bangladesh", "Belarus",
    "Belgium", "Bolivia", "Bosnia and Herzegovina", "Brazil", "Bulgaria", "Canada", "Chile", "China",
    "Colombia", "Croatia", "Czechia", "Denmark", "Egypt", "Estonia", "Ethiopia", "Finland", "France",
    "Georgia", "Germany", "Ghana", "Greece", "Hong Kong", "Iceland", "India", "Indonesia", "Iraq",
    "Ireland", "Israel", "Italy", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kuwait", "Latvia",
    "Lebanon", "Libya", "Lithuania", "Luxembourg", "Macedonia", "Malawi", "Malaysia", "Mexico",
    "Montenegro", "Morocco", "Mozambique", "Nepal", "Netherlands", "New Zealand", "Nigeria", "Norway",
    "Oman", "Pakistan", "Panama", "Peru", "Philippines", "Poland", "Portugal", "Puerto Rico", "Qatar",
    "Romania", "Russia", "Saudi Arabia", "Senegal", "Serbia", "Singapore", "Slovakia", "Slovenia",
    "South Africa", "South Korea", "Spain", "Sri Lanka", "Sweden", "Switzerland", "Taiwan", "Tanzania",
    "Thailand", "Tunisia", "Turkey", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom",
    "United States", "Venezuela", "Vietnam", "Yemen", "Zimbabwe", "Worldwide / Global"
  ];

  const languages = [
    "Afrikaans", "Albanian", "Amharic", "Arabic", "Armenian", "Azerbaijani", "Bangla", "Basque",
    "Belarusian", "Bosnian", "Bulgarian", "Catalan", "Chinese", "Croatian", "Czech", "Danish",
    "Dutch", "English", "Estonian", "Filipino", "Finnish", "French", "Galician", "Georgian",
    "German", "Greek", "Gujarati", "Hebrew", "Hindi", "Hungarian", "Icelandic", "Indonesian",
    "Italian", "Japanese", "Kannada", "Kazakh", "Korean", "Kurdish", "Latvian", "Lithuanian",
    "Malay", "Malayalam", "Marathi", "Nepali", "Norwegian", "Pashto", "Persian", "Polish",
    "Portuguese", "Punjabi", "Romanian", "Russian", "Serbian", "Sindhi", "Sinhala", "Slovak",
    "Slovenian", "Somali", "Spanish", "Swahili", "Swedish", "Tamil", "Telugu", "Thai",
    "Turkish", "Ukrainian", "Urdu", "Uzbek", "Vietnamese"
  ];

  function populateDropdowns() {
    const fCat = document.getElementById('filterCategory');
    const fCount = document.getElementById('filterCountry');
    const fLang = document.getElementById('filterLanguage');
    const inCat = document.getElementById('inCat');
    const inCount = document.getElementById('inCountry');
    const inLang = document.getElementById('inLang');

    fCat.innerHTML = '<option value="All">Select Group Category</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
    fCount.innerHTML = '<option value="All">Select Group Country</option>' + countries.map(c => `<option value="${c}">${c}</option>`).join('');
    fLang.innerHTML = '<option value="All">Select Group Language</option>' + languages.map(l => `<option value="${l}">${l}</option>`).join('');

    inCat.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    inCount.innerHTML = countries.map(c => `<option value="${c}">${c}</option>`).join('');
    inLang.innerHTML = languages.map(l => `<option value="${l}">${l}</option>`).join('');
  }

  const defaultGroups = [
    { name: "Fortnite USA & EU Squads", cat: "Gaming/Apps", country: "United States", lang: "English", link: "https://chat.whatsapp.com/" },
    { name: "Crypto & Forex Signals Daily", cat: "Money/Earning", country: "United Kingdom", lang: "English", link: "https://t.me/" },
    { name: "Bollywood & Hollywood Masti", cat: "Entertainment/Masti", country: "India", lang: "Hindi", link: "https://chat.whatsapp.com/" },
    { name: "Global Memes & Jokes Club", cat: "Thoughts/Quotes/Jokes", country: "Worldwide / Global", lang: "English", link: "https://t.me/" }
  ];

  let groups = JSON.parse(localStorage.getItem('groupsor_live_db')) || defaultGroups;

  function renderList(list) {
    const container = document.getElementById('groupGrid');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 20px;">No groups found for this selection.</p>';
      return;
    }
    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'group-card';
      card.innerHTML = `
        <div>
          <div class="group-title">${item.name}</div>
          <div class="group-tags">
            📁 Category: <b>${item.cat}</b><br>
            🌍 Country: <b>${item.country}</b><br>
            🗣️ Language: <b>${item.lang}</b>
          </div>
        </div>
        <button class="btn-join" onclick="handleJoin('${item.link}')">Join Group</button>
      `;
      container.appendChild(card);
    });
  }

  function handleJoin(targetLink) {
    window.open(ADSTERRA_DIRECT_LINK, '_blank');
    setTimeout(() => {
      window.location.href = targetLink;
    }, 400);
  }

  function applyFilter() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('filterCategory').value;
    const country = document.getElementById('filterCountry').value;
    const lang = document.getElementById('filterLanguage').value;

    const filtered = groups.filter(g => {
      const matchSearch = g.name.toLowerCase().includes(search);
      const matchCat = (cat === "All" || g.cat === cat);
      const matchCountry = (country === "All" || g.country === country);
      const matchLang = (lang === "All" || g.lang === lang);
      return matchSearch && matchCat && matchCountry && matchLang;
    });

    renderList(filtered);
  }

  function openModal() { document.getElementById('addModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('addModal').style.display = 'none'; }

  function submitGroup() {
    const link = document.getElementById('inLink').value.trim();
    const name = document.getElementById('inName').value.trim();
    const cat = document.getElementById('inCat').value;
    const country = document.getElementById('inCountry').value;
    const lang = document.getElementById('inLang').value;

    if(!link || !name) {
      alert("Please fill Group Link and Name!");
      return;
    }

    groups.unshift({ name, cat, country, lang, link });
    localStorage.setItem('groupsor_live_db', JSON.stringify(groups));
    renderList(groups);
    closeModal();
    alert("Group added successfully!");
  }

  populateDropdowns();
  renderList(groups);
</script>

</body>
</html>
