<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinkSphere - Discover & Join WhatsApp Groups</title>
  <meta name="description" content="Discover direct WhatsApp group links across top categories and languages worldwide.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: #fff0f5; color: #2d0c21; }
    
    /* Header */
    header { background: linear-gradient(135deg, #ff1493, #e00070); color: white; padding: 30px 15px; text-align: center; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.25); }
    header h1 { font-size: 30px; font-weight: 900; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.15); }
    header p { font-size: 14px; opacity: 0.95; margin-top: 6px; font-weight: 500; }
    
    .container { max-width: 950px; margin: auto; padding: 20px 15px; }

    /* Top Actions */
    .top-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 14px 16px; background: white; border: 2px solid #ffb6c1; border-radius: 12px; font-size: 15px; outline: none; color: #333; transition: 0.2s; }
    .search-box input:focus { border-color: #ff1493; box-shadow: 0 0 8px rgba(255, 20, 147, 0.2); }
    
    .btn-add-main { background: linear-gradient(135deg, #ff007f, #d8006b); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3); transition: 0.2s; }
    .btn-add-main:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Filter Box */
    .filter-card { background: white; padding: 18px; border-radius: 14px; border: 1.5px solid #ffccd5; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.08); margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
    .filter-card select { width: 100%; padding: 12px; border: 1.5px solid #ffaec0; border-radius: 10px; font-size: 14px; outline: none; background: #fffafd; color: #4a1532; font-weight: 500; }
    .filter-card select:focus { border-color: #ff1493; }
    .btn-find { background: linear-gradient(135deg, #ff69b4, #ff1493); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }

    /* Group Cards Grid */
    .group-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .group-card { background: white; border-radius: 14px; padding: 18px; border: 1.5px solid #ffd1dc; box-shadow: 0 4px 12px rgba(255, 182, 193, 0.25); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .group-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #25D366, #ff1493); }
    .group-title { font-size: 17px; font-weight: 700; color: #b30059; margin-bottom: 10px; }
    .group-tags { font-size: 13px; color: #6e2c4c; margin-bottom: 18px; line-height: 1.6; }
    
    .btn-join { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #25D366, #128C7E); color: white; padding: 11px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3); transition: 0.2s; }
    .btn-join:hover { opacity: 0.9; }

    /* Footer */
    footer { text-align: center; padding: 30px 15px; font-size: 12px; color: #a26081; border-top: 1px solid #ffd1dc; margin-top: 40px; }
    footer a { color: #ff1493; text-decoration: none; font-weight: bold; }

    /* Modal Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(74, 21, 50, 0.6); backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 15px; z-index: 999; }
    .modal-content { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border: 2px solid #ffb6c1; }
    .modal-content h3 { color: #d8006b; margin-bottom: 15px; font-size: 20px; }
    .modal-content label { display: block; font-size: 13px; font-weight: 600; color: #80134b; margin-bottom: 5px; }
    .modal-content input, .modal-content select { width: 100%; padding: 12px; margin-bottom: 14px; border: 1.5px solid #ffccd5; border-radius: 8px; font-size: 14px; background: #fffafd; outline: none; }
    .modal-content input:focus, .modal-content select:focus { border-color: #ff1493; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }
    .btn-cancel { background: #e0d0d8; color: #4a1532; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>PinkSphere</h1>
  <p>Global WhatsApp Groups Directory</p>
</header>

<div class="container">

  <div class="top-actions">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search WhatsApp groups by category, country or language..." onkeyup="applyFilter()">
    </div>
    <button class="btn-add-main" onclick="openModal()">+ Add WhatsApp Group Link</button>
  </div>

  <div class="filter-card">
    <select id="filterCategory" onchange="applyFilter()"></select>
    <select id="filterCountry" onchange="applyFilter()"></select>
    <select id="filterLanguage" onchange="applyFilter()"></select>
    <button class="btn-find" onclick="applyFilter()">Search Groups</button>
  </div>

  <div class="group-list" id="groupGrid"></div>

</div>

<footer>
  <p>© 2026 PinkSphere Network. All rights reserved.</p>
  <p style="margin-top: 6px;"><b>Disclaimer:</b> PinkSphere is an independent community directory. We are not affiliated with WhatsApp LLC.</p>
  <p style="margin-top: 4px;">To request link removal or report an issue: <a href="mailto:contact.pinksphere@gmail.com">Report / Contact</a></p>
</footer>

<!-- ADD GROUP MODAL (ONLY WHATSAPP) -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Add WhatsApp Group</h3>
    
    <label>WhatsApp Group Invite Link Only:</label>
    <input type="text" id="inLink" placeholder="https://chat.whatsapp.com/...">
    
    <label>Select Category:</label>
    <select id="inCat"></select>
    
    <label>Select Country:</label>
    <select id="inCountry"></select>
    
    <label>Select Language:</label>
    <select id="inLang"></select>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add-main" id="btnSubmit" style="padding: 10px 20px;" onclick="submitGroup()">Add Group</button>
    </div>
  </div>
</div>

<script>
  const ADSTERRA_DIRECT_LINK = "https://www.effectivecpmnetwork.com/bwk3i6y31?key=6e1b96d31c0b3e0dcc81cd10c035d3dd";
  const FIREBASE_DB_URL = "https://pinksphere-hub-default-rtdb.firebaseio.com/groups.json";

  const categories = [
    "Adult/18+/Hot", "Art/Design/Photography", "Auto/Vehicle", "Business/Advertising/Marketing",
    "Comedy/Funny", "Dating/Flirting/Chatting", "Education/School", "Entertainment/Masti",
    "Family/Relationships", "Fan Club/Celebrities", "Fashion/Style/Clothing", "Film/Animation",
    "Food/Drinks", "Gaming/Apps", "Health/Beauty/Fitness", "Jobs/Career", "Money/Earning",
    "Music/Audio/Songs", "News/Magazines/Politics", "Pets/Animals/Nature", "Roleplay/Comics",
    "Science/Technology", "Shopping/Buy/Sell", "Social/Friendship/Community", "Spiritual/Devotional",
    "Sports/Games", "Thoughts/Quotes/Jokes", "Travel/Local/Place"
  ];

  const countries = [
    "Algeria", "Argentina", "Australia", "Austria", "Azerbaijan", "Bahrain", "Bangladesh", "Belarus",
    "Belgium", "Bolivia", "Bosnia and Herzegovina", "Brazil", "Bulgaria", "Canada", "Chile", "China",
    "Colombia", "Croatia", "Czechia", "Denmark", "Egypt", "Estonia", "Ethiopia", "Finland", "France",
    "Georgia", "Germany", "Ghana", "Greece", "Hong Kong", "Iceland", "India", "Indonesia", "Iraq",
    "Ireland", "Israel", "Italy", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kuwait", "Latvia",
    "Lebanon", "Libya", "Lithuania", "Luxembourg", "Macedonia", "Malawi", "Malaysia", "Mexico",
    "Montenegro", "Morocco", "Mozambique", "Nepal", "Netherlands", "New Zealand", "Nigeria", "Norway",
    "Oman", "Pakistan", "Panama", "Peru", "Philippines", "Poland", "Portugal", "Puerto Rico", "Qatar",
    "Romania", "Russia", "Saudi Arabia", "Senegal", "Serbia", "Singapore", "Slovakia", "Slovenia",
    "South Africa", "South Korea", "Spain", "Sri Lanka", "Sweden", "Switzerland", "Taiwan", "Tanzania",
    "Thailand", "Tunisia", "Turkey", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom",
    "United States", "Venezuela", "Vietnam", "Yemen", "Zimbabwe", "Worldwide / Global"
  ];

  const languages = [
    "Afrikaans", "Albanian", "Amharic", "Arabic", "Armenian", "Azerbaijani", "Bangla", "Basque",
    "Belarusian", "Bosnian", "Bulgarian", "Catalan", "Chinese", "Croatian", "Czech", "Danish",
    "Dutch", "English", "Estonian", "Filipino", "Finnish", "French", "Galician", "Georgian",
    "German", "Greek", "Gujarati", "Hebrew", "Hindi", "Hungarian", "Icelandic", "Indonesian",
    "Italian", "Japanese", "Kannada", "Kazakh", "Korean", "Kurdish", "Latvian", "Lithuanian",
    "Malay", "Malayalam", "Marathi", "Nepali", "Norwegian", "Pashto", "Persian", "Polish",
    "Portuguese", "Punjabi", "Romanian", "Russian", "Serbian", "Sindhi", "Sinhala", "Slovak",
    "Slovenian", "Somali", "Spanish", "Swahili", "Swedish", "Tamil", "Telugu", "Thai",
    "Turkish", "Ukrainian", "Urdu", "Uzbek", "Vietnamese"
  ];

  function sanitize(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function populateDropdowns() {
    const fCat = document.getElementById('filterCategory');
    const fCount = document.getElementById('filterCountry');
    const fLang = document.getElementById('filterLanguage');
    const inCat = document.getElementById('inCat');
    const inCount = document.getElementById('inCountry');
    const inLang = document.getElementById('inLang');

    fCat.innerHTML = '<option value="All">All Categories</option>' + categories.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    fCount.innerHTML = '<option value="All">All Countries</option>' + countries.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    fLang.innerHTML = '<option value="All">All Languages</option>' + languages.map(l => `<option value="${sanitize(l)}">${sanitize(l)}</option>`).join('');

    inCat.innerHTML = categories.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    inCount.innerHTML = countries.map(c => `<option value="${sanitize(c)}">${sanitize(c)}</option>`).join('');
    inLang.innerHTML = languages.map(l => `<option value="${sanitize(l)}">${sanitize(l)}</option>`).join('');
  }

  let groups = [];

  async function fetchLiveGroups() {
    try {
      const res = await fetch(FIREBASE_DB_URL);
      const data = await res.json();
      if (data) {
        groups = Object.values(data).reverse();
      } else {
        groups = [
          { cat: "Gaming/Apps", country: "United States", lang: "English", link: "https://chat.whatsapp.com/sample1" },
          { cat: "Money/Earning", country: "United Kingdom", lang: "English", link: "https://chat.whatsapp.com/sample2" },
          { cat: "Entertainment/Masti", country: "India", lang: "Punjabi", link: "https://chat.whatsapp.com/sample3" }
        ];
      }
      renderList(groups);
    } catch(err) {
      console.log("Offline mode");
    }
  }

  function renderList(list) {
    const container = document.getElementById('groupGrid');
    container.innerHTML = '';
    if(list.length === 0) {
      container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 25px; color:#a26081; font-weight:bold;">No WhatsApp groups found for this selection.</p>';
      return;
    }
    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'group-card';
      const displayTitle = sanitize(`${item.country} • ${item.cat}`);
      card.innerHTML = `
        <div>
          <div class="group-title">${displayTitle}</div>
          <div class="group-tags">
            🌸 <b>Category:</b> ${sanitize(item.cat)}<br>
            🌍 <b>Country:</b> ${sanitize(item.country)}<br>
            🗣️ <b>Language:</b> ${sanitize(item.lang)}
          </div>
        </div>
        <button class="btn-join" onclick="handleJoin('${encodeURI(item.link)}')">Join WhatsApp Group</button>
      `;
      container.appendChild(card);
    });
  }

  function handleJoin(targetLink) {
    window.open(ADSTERRA_DIRECT_LINK, '_blank');
    setTimeout(() => {
      window.location.href = targetLink;
    }, 400);
  }

  function applyFilter() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('filterCategory').value;
    const country = document.getElementById('filterCountry').value;
    const lang = document.getElementById('filterLanguage').value;

    const filtered = groups.filter(g => {
      const textToSearch = `${g.cat} ${g.country} ${g.lang}`.toLowerCase();
      const matchSearch = textToSearch.includes(search);
      const matchCat = (cat === "All" || g.cat === cat);
      const matchCountry = (country === "All" || g.country === country);
      const matchLang = (lang === "All" || g.lang === lang);
      return matchSearch && matchCat && matchCountry && matchLang;
    });

    renderList(filtered);
  }

  function openModal() { document.getElementById('addModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('addModal').style.display = 'none'; }

  let lastSubmissionTime = 0;

  async function submitGroup() {
    const now = Date.now();
    // Anti-spam cooldown (20s)
    if (now - lastSubmissionTime < 20000) {
      alert("Please wait a few seconds before submitting another link.");
      return;
    }

    const link = document.getElementById('inLink').value.trim();
    const cat = document.getElementById('inCat').value;
    const country = document.getElementById('inCountry').value;
    const lang = document.getElementById('inLang').value;

    // Strict WhatsApp Link Validation
    const isWhatsAppUrl = /^(https?:\/\/)?chat\.whatsapp\.com\/[a-zA-Z0-9_\-]+/i.test(link);
    if(!isWhatsAppUrl) {
      alert("Invalid link! Only official WhatsApp group invite links (chat.whatsapp.com/...) are accepted.");
      return;
    }

    const newGroup = { cat, country, lang, link, timestamp: now };
    
    try {
      document.getElementById('btnSubmit').innerText = "Adding...";
      await fetch(FIREBASE_DB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newGroup)
      });
      lastSubmissionTime = now;
      document.getElementById('btnSubmit').innerText = "Add Group";
      groups.unshift(newGroup);
      renderList(groups);
      document.getElementById('inLink').value = '';
      closeModal();
      alert("WhatsApp group added live globally!");
    } catch(e) {
      alert("Error submitting. Please check your internet connection.");
    }
  }

  populateDropdowns();
  fetchLiveGroups();
</script>

</body>
</html>
